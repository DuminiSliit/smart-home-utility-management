services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    user: "0:0"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    working_dir: /home/dynamodblocal
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "127.0.0.1:8000:8000"

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./BackendDev/LocalDev/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log

  init-dynamodb:
    build:
      context: ./BackendDev
      dockerfile: LocalDev/Dockerfile
    command: ["python", "/app/LocalDev/init_dynamodb.py"]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: eu-north-1
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
    depends_on:
      dynamodb-local:
        condition: service_started
    restart: "no"

  mqtt-bridge:
    build:
      context: ./BackendDev
      dockerfile: LocalDev/Dockerfile
    command: ["python", "/app/LocalDev/mqtt_bridge.py"]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: eu-north-1
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      SENSOR_TABLE: SensorData
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: ESP32_AWSDB/pub
    depends_on:
      init-dynamodb:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: unless-stopped

  flask:
    build:
      context: ./BackendDev
      dockerfile: LocalDev/Dockerfile
    command: ["python", "PythonFlask/backendServer.py"]
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: eu-north-1
      AWS_REGION: eu-north-1
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      DEVICE_ID: sparksense-1
      DEVICE_NAME: Bulb
      CURRENT_SENSOR_ENABLED: "1"
      SENSOR_TABLE: SensorData
      HOURLY_TABLE: AWS_HourlyData_24hrs
      MONTHLY_TABLE: AWS_MonthlyData_30or31Days
      FLASK_DEBUG: "0"
      RUN_BACKGROUND_JOBS: "1"
    ports:
      - "5000:5000"
    depends_on:
      init-dynamodb:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  dynamodb-data:
  mosquitto-data:
  mosquitto-logs:
